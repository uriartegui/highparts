name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: highparts-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend and backend
        run: npm run build

      - name: Prepare production configuration
        run: node scripts/prepare-cloudflare-deploy.mjs
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME || 'highparts-product-images' }}
          AUTH_FROM_EMAIL: ${{ vars.AUTH_FROM_EMAIL }}
          MERCADO_PAGO_ENV: ${{ vars.MERCADO_PAGO_ENV }}
          BLING_INTEGRATION_ENABLED: ${{ vars.BLING_INTEGRATION_ENABLED }}
          BLING_PAYMENT_METHOD_ID: ${{ vars.BLING_PAYMENT_METHOD_ID }}
          BLING_PAID_ORDER_STATUS_ID: ${{ vars.BLING_PAID_ORDER_STATUS_ID }}

      - name: Ensure product image storage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME || 'highparts-product-images' }}
        run: |
          if ! npx wrangler r2 bucket list | grep -Fq "$R2_BUCKET_NAME"; then
            npx wrangler r2 bucket create "$R2_BUCKET_NAME"
          fi

      - name: Apply database migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          command: d1 migrations apply ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }} --remote --config dist/server/wrangler.deploy.json

      - name: Deploy application
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          command: deploy --config dist/server/wrangler.deploy.json
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deployment summary
        run: echo "Production deployment completed." >> "$GITHUB_STEP_SUMMARY"

